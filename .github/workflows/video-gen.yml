name: 動画の作り置き(Gemini)

# 写真から、Gemini API(gemini-omni-1.2-flash)で作り置きの動画を作る(src/gen-video.js)。
# 1本12秒で約0.84ドル。お金の守りは gen-video.js の冒頭を参照。
# 今は手動だけ。試しの1本がよければ、定期実行(schedule)を足す。
on:
  workflow_dispatch:
    inputs:
      photo:
        description: '作る写真(photos/の中のファイル名)。空なら自動で選ぶ(縦長を先に)'
        required: false
        default: ''
      max_videos:
        description: '作る本数(1か2)'
        required: false
        default: '1'
      duration:
        description: '動画の長さ(秒、3〜15)'
        required: false
        default: '12'
      dry_run:
        description: 'trueなら動画は作らず、指示文と切り出しだけ確かめる(費用なし)'
        required: false
        default: 'false'

permissions:
  contents: write

# 本番の投稿(post.yml)の列には入れない(待ちは1つしか持てず、本番の順番待ちを消すおそれがあるため)
concurrency:
  group: video-gen
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2026-11-12、Ubuntuの配布元の障害で止まったので、区切って試し、だめなら公式の配布元に切り替える(scripts/install-apt.sh)
      - name: ffmpegと日本語フォントをインストール
        timeout-minutes: 35
        run: bash scripts/install-apt.sh ffmpeg fonts-noto-cjk

      - name: 動画を作る
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PHOTO: ${{ github.event.inputs.photo }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos }}
          DURATION_SEC: ${{ github.event.inputs.duration }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          MONTHLY_CAP_USD: '15'
          STOCK_TARGET: '6'
        run: node src/gen-video.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-gen
          path: |
            generated/video-gen/
            generated/check/
          retention-days: 7
