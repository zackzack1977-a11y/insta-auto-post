name: Instagram自動投稿

on:
  # 2026-11-20: 主はパソコンの予定タスク「インスタ投稿の準備_月水金9時」(gh workflow run ... -f daily_guard=true)。
  # GitHubの定時実行は6〜7時間遅れるので、パソコンが止まっていたときの控え(月水金 8:30 JST)。
  # どちらかが先に準備したら、もう片方は「今日は提示済み」でスキップする。
  schedule:
    - cron: '30 23 * * 0,2,4'
  workflow_dispatch:
    inputs:
      daily_guard:
        description: 'trueなら、今日すでに提示済みのときはスキップ(パソコンの予定タスク用)'
        required: false
        default: 'false'

permissions:
  contents: write

# scheduleと手動実行(workflow_dispatch)が重なった場合に、同じ写真を二重処理したり
# git pushが衝突して失敗したりしないよう、同時実行を避けてキューイングする
# (実行中のジョブを強制終了すると投稿処理が中途半端な状態で切れてしまうため
#  cancel-in-progressはfalseにする)。
concurrency:
  group: insta-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpegと日本語フォントをインストール
        timeout-minutes: 35
        run: bash scripts/install-apt.sh ffmpeg fonts-noto-cjk

      - name: 投稿を実行
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          PUBLISH_SIGNING_SECRET: ${{ secrets.PUBLISH_SIGNING_SECRET }}
          PUBLISH_WORKER_URL: ${{ secrets.PUBLISH_WORKER_URL }}
          DAILY_GUARD: ${{ github.event.inputs.daily_guard || 'false' }}
        run: node src/post.js
