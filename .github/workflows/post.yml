name: Instagram自動投稿

on:
  schedule:
    - cron: '0 2 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write

# scheduleと手動実行(workflow_dispatch)が重なった場合に、同じ写真を二重処理したり
# git pushが衝突して失敗したりしないよう、同時実行を避けてキューイングする
# (実行中のジョブを強制終了すると投稿処理が中途半端な状態で切れてしまうため
#  cancel-in-progressはfalseにする)。
concurrency:
  group: insta-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpegと日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 投稿を実行
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PUBLISH_SIGNING_SECRET: ${{ secrets.PUBLISH_SIGNING_SECRET }}
          PUBLISH_WORKER_URL: ${{ secrets.PUBLISH_WORKER_URL }}
        run: node src/post.js
