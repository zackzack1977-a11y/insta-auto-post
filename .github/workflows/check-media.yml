name: Instagram投稿の診断確認

on:
  workflow_dispatch:
    inputs:
      media_id:
        description: '確認したいメディアID(creationId)'
        required: true
      fields:
        description: '取得したいフィールド(カンマ区切り)'
        required: false
        default: 'id,location'
      list:
        description: '1にすると、media_idをIGユーザーIDとして扱い投稿一覧エッジ経由で取得する'
        required: false
        default: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: メディア情報を確認
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          MEDIA_ID: ${{ github.event.inputs.media_id }}
          FIELDS: ${{ github.event.inputs.fields }}
          LIST: ${{ github.event.inputs.list }}
        run: node src/check-media.js
